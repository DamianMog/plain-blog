name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint deploy script
        run: |
          bash -n scripts/deploy.sh
          shellcheck scripts/deploy.sh

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://example.com

      - name: Verify build output
        run: npm run verify
